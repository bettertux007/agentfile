          mode: "subagent"
          color: "#E86E00"
          permissions:
            - { action: "*", resource: "*", effect: "deny" }
            - { action: "read", resource: "*", effect: "allow" }
            - { action: "read", resource: "*.env", effect: "deny" }
            - { action: "read", resource: "*.env.*", effect: "deny" }
            - { action: "read", resource: "*.env.example", effect: "allow" }
            - { action: "glob", resource: "*", effect: "allow" }
            - { action: "external_directory", resource: "*", effect: "deny" }
          system: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read .opencode/skills/egm-bundle/agents/zoom_out.md before the target and supplied standards. Return findings to the caller. Do not write reports or delegate. Read prior reports only when explicitly supplied and required by the canonical stage. Do not retrieve unsolicited history, memory, or earlier reviewer findings. Report inaccessible required files as an incomplete review."
        egm:
          description: "EGM orchestrator"
          mode: "primary"
          color: "#1B6EF3"
          permissions:
            - { action: "*", resource: "*", effect: "ask" }
            - { action: "read", resource: "*", effect: "allow" }
            - { action: "read", resource: "*.env", effect: "ask" }
            - { action: "read", resource: "*.env.*", effect: "ask" }
            - { action: "read", resource: "*.env.example", effect: "allow" }
            - { action: "glob", resource: "*", effect: "allow" }
            - { action: "grep", resource: "*", effect: "allow" }
            - { action: "question", resource: "*", effect: "allow" }
            - { action: "skill", resource: "*", effect: "deny" }
            - { action: "skill", resource: "egm-*", effect: "allow" }
            - { action: "subagent", resource: "*", effect: "deny" }
            - { action: "subagent", resource: "egm-codebase-details", effect: "allow" }
            - { action: "subagent", resource: "egm-comprehension", effect: "allow" }
            - { action: "subagent", resource: "egm-design", effect: "allow" }
            - { action: "subagent", resource: "egm-implementation-readiness", effect: "allow" }
            - { action: "subagent", resource: "egm-inventive-catalyst", effect: "allow" }
            - { action: "subagent", resource: "egm-structural", effect: "allow" }
            - { action: "subagent", resource: "egm-style", effect: "allow" }
            - { action: "subagent", resource: "egm-zoom-out", effect: "allow" }
            - { action: "external_directory", resource: "*", effect: "ask" }
          system: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Follow the canonical skill. Dispatch reviewers directly with the subagent tool using the registered persona name as agent (for example egm-zoom-out). Omit sessionID for every independent review; never resume a reviewer. Wait for subagent completion before synthesizing. Pass only the task, absolute resource paths, target, standards, and selected reading list, not conversation history. Stop if delegation or a required completion is missing. When running brainstorm before draft, complete all seven brainstorm reviewers and synthesize their findings into concepts_brief.md before drafting. In review, write each completed stage report before starting the next stage. Before Step 8, verify zoom_out_report.md exists in the artifact directory and pass its absolute path to the reviewer; stop if it is missing. Write reports yourself. Preserve every human approval gate."
      commands:
        egm-bootstrap:
          description: "Run egm-bootstrap"
          agent: "egm"
          template: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read and execute .opencode/skills/egm-bundle/skills/egm-bootstrap/SKILL.md.\nUser request: $ARGUMENTS"
        egm-brainstorm:
          description: "Run egm-brainstorm"
          agent: "egm"
          template: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read and execute .opencode/skills/egm-bundle/skills/egm-brainstorm/SKILL.md.\nUser request: $ARGUMENTS"
