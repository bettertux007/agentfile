          template: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read and execute .opencode/skills/egm-bundle/skills/egm-review-loop/SKILL.md.\nUser request: $ARGUMENTS"
  claude:
    load_global: false

settings:
  permissions:
    allow_commands:
      - "go test"
      - "go vet"
      - "go build"
      - "gofmt"
      - "make"
      - "git status"
      - "git diff"
      - "git log"
    deny_commands:
      - "rm -rf /"
      - "git push --force"
      - "git reset --hard"

skills:
  - name: egm-bundle
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
  - name: egm-brainstorm
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-brainstorm
  - name: egm-draft
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-draft
  - name: egm-review
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-review
  - name: egm-review-loop
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-review-loop
  - name: egm-resolve
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-resolve
  - name: egm-drift-report
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-drift-report
  - name: egm-bootstrap
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: skills/egm-bootstrap
  - name: add-target-adapter
    source: ./.agentfile/skills/add-target-adapter
  - name: release-check
    source: ./.agentfile/skills/release-check

agents:
  - name: egm-zoom-out
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: agents/zoom_out.md
    description: "EGM read-only zoom_out reviewer"
  - name: egm-design
    source:
      git: https://github.com/google/elephant-goldfish-model.git
