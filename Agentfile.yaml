            - { action: "external_directory", resource: "*", effect: "deny" }
          system: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read .opencode/skills/egm-bundle/agents/comprehension.md before the target and supplied standards. Return findings to the caller. Do not write reports or delegate. Read prior reports only when explicitly supplied and required by the canonical stage. Do not retrieve unsolicited history, memory, or earlier reviewer findings. Report inaccessible required files as an incomplete review."
