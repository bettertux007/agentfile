    description: "EGM read-only style reviewer"
  - name: egm-synthesizer
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: agents/synthesizer.md
    description: "EGM synthesizer orchestrator subagent"
  - name: egm-bootstrap-orchestrator
    source:
      git: https://github.com/google/elephant-goldfish-model.git
      ref: 8b1553f5c6dc84c60b7e065f0040199d72c54c54
      path: agents/bootstrap_orchestrator.md
    description: "EGM bootstrap orchestrator subagent"
  - name: adapter-reviewer
    source: ./.agentfile/agents/adapter-reviewer.md
    description: "Audits agentfile target adapters for I/O-free purity, DAG compliance, policy enforcement, and golden tests"
  - name: security-reviewer
    source: ./.agentfile/agents/security-reviewer.md
    description: "Audits agentfile Git hydration, manifest composition, secret redaction, and fail-closed security invariants"

rules:
  - name: egm-project-binding
    source: ./.agentfile/rules/egm-project-binding.md
    description: "Binds EGM artifact directory (.egm) and workspace EGM bundle root for isolated sessions"
    always_apply: true
  - name: go-testing-portability
    source: ./.agentfile/rules/go-testing-portability.md
    description: "Hermetic Go testing and Windows/Linux/macOS portability standards"
    globs:
      - "**/*_test.go"
  - name: schema-manifest-sync
    source: ./.agentfile/rules/schema-manifest-sync.md
    description: "Lockstep synchronization across internal/spec, schemas/v1, and root/starter Agentfile.yaml manifests"
    globs:
      - "internal/spec/**"
      - "schemas/**"
      - "internal/adapters/**"
