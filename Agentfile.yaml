# yaml-language-server: $schema=./schemas/v1/agentfile.schema.json
version: 1

targets:
  - opencode
  - claude

targets_config:
  opencode:
    load_global: false
    overrides:
      plugins:
        - "superpowers@git+https://github.com/obra/superpowers.git"
      agents:
        egm-codebase-details:
          description: "EGM read-only codebase_details reviewer"
          mode: "subagent"
          color: "#E86E00"
          permissions:
            - { action: "*", resource: "*", effect: "deny" }
            - { action: "read", resource: "*", effect: "allow" }
            - { action: "read", resource: "*.env", effect: "deny" }
            - { action: "read", resource: "*.env.*", effect: "deny" }
            - { action: "read", resource: "*.env.example", effect: "allow" }
            - { action: "glob", resource: "*", effect: "allow" }
            - { action: "external_directory", resource: "*", effect: "deny" }
          system: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read .opencode/skills/egm-bundle/agents/codebase_details.md before the target and supplied standards. Return findings to the caller. Do not write reports or delegate. Read prior reports only when explicitly supplied and required by the canonical stage. Do not retrieve unsolicited history, memory, or earlier reviewer findings. Report inaccessible required files as an incomplete review."
        egm-comprehension:
          description: "EGM read-only comprehension reviewer"
          mode: "subagent"
          color: "#E86E00"
          permissions:
            - { action: "*", resource: "*", effect: "deny" }
