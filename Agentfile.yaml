          template: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read and execute .opencode/skills/egm-bundle/skills/egm-resolve/SKILL.md.\nUser request: $ARGUMENTS"
        egm-review:
          description: "Run egm-review"
          agent: "egm"
          template: "Read .opencode/skills/egm-bundle/docs/opencode.md first. EGM bundle root: .opencode/skills/egm-bundle. Resolve agents/, resources/, and docs/ against this root. Resolve references/ against the canonical skill directory. Resolve user files and outputs against the project working directory. Read and execute .opencode/skills/egm-bundle/skills/egm-review/SKILL.md.\nUser request: $ARGUMENTS"
        egm-review-loop:
