name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Vet and format check
        shell: bash
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Build binary
        run: go build ./cmd/agentfile
